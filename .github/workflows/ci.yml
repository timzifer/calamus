name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -short -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cgo-free build for every target
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 linux/386 windows/amd64 darwin/arm64 js/wasm wasip1/wasm; do
            GOOS=${t%/*} GOARCH=${t#*/} go build ./... || exit 1
          done

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run XXX -fuzz FuzzSameAsImagePNG -fuzztime 60s ./png
